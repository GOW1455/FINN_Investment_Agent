services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FINN_FALLBACK_MODEL
        value: gemini/gemini-3.1-flash-lite,gemini/gemini-flash-lite-latest
      - key: FINN_FAST_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: FINN_OFFLINE
        value: "0"
      - key: FINN_READ_ANNUAL_REPORT
        value: "0"
