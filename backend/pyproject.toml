[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "litellm>=1.109.1",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
